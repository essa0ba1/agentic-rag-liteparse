services:
  # ── Qdrant vector database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── RAG application (Gradio UI + pipeline) ──────────────────────────────
  rag-app:
    build: .
    ports:
      - "7060:7060"
    volumes:
      - ./data:/app/data
    environment:
      # Override config.py defaults via env vars if you wire them in
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
